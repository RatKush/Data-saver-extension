<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Saver Controls</title>
  <style>
    :root {
      --bg: #1e1e20;
      --surface: #29292c;
      --surface-2: #323235;
      --border: #3a3a3e;
      --text: #f2f2f3;
      --text-muted: #9a9aa0;
      --accent: #9b3bff;
      --accent-hover: #8425f0;
      --accent-soft: rgba(155, 59, 255, 0.16);
      --off: #55555b;
    }

    * { box-sizing: border-box; }

    /* Pinning html too keeps RTL anchored correctly when the panel is rendered
       in a viewport wider than itself, as headless screenshots are. */
    html { width: 360px; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      width: 360px;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 20px 15px;
      border-bottom: 1px solid var(--border);
    }

    .header img {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .header-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .header-text p {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* ---------- Savings meter ---------- */
    .savings {
      margin: 14px 14px 4px;
      padding: 16px 16px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .savings-top {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 3px;
    }

    /* The big number is hidden until there is something to show — a lone
       placeholder dash reads as a rendering glitch, not as "no data yet".
       display:flex would otherwise beat the hidden attribute's display:none. */
    .savings-top[hidden] { display: none; }

    #savedAmount {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    #savedUnit {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .savings-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .savings-breakdown {
      display: flex;
      gap: 14px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .savings-stat {
      flex: 1;
      min-width: 0;
    }

    .savings-stat b {
      display: block;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .savings-stat span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* RTL: the few places where physical direction was assumed. Everything else
       is flexbox, which mirrors on its own. */
    [dir="rtl"] .savings-foot,
    [dir="rtl"] .savings-breakdown { direction: rtl; }
    [dir="rtl"] .savings-stat { text-align: right; }
    [dir="rtl"] .shortcut-hint kbd { direction: ltr; display: inline-block; }

    .savings-foot {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    #resetStats {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #resetStats:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    /* ---------- Toggle rows ---------- */
    .rules {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rule-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .rule-row:hover {
      background: var(--surface);
    }

    .rule-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .rule-body {
      flex: 1;
      min-width: 0;
    }

    .rule-title {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }

    .rule-subtitle {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ---------- Switch ---------- */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--off);
      transition: background-color 0.2s ease;
      border-radius: 999px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      top: 2px;
      background-color: white;
      transition: transform 0.2s ease;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider::before {
      transform: translateX(16px);
    }

    input:focus-visible + .slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Site control (primary action) ---------- */
    /* Blocking is aggressive everywhere, so "make this one site work" is the
       most important control in the popup and sits first, above the meter and
       the toggles. It used to be a small button at the bottom, below three
       switches — which meant the fastest visible fix for a broken page was to
       uninstall. */
    .site-primary {
      margin: 14px 14px 0;
      padding: 13px 14px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .site-line {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .site-dot {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .site-body {
      flex: 1;
      min-width: 0;
    }

    #siteHost {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #siteStatus {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    #siteStatus.paused {
      color: var(--accent);
    }

    #siteToggleBtn {
      width: 100%;
      margin-top: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    #siteToggleBtn:hover:not(:disabled) {
      background: var(--off);
    }

    #siteToggleBtn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Paused is the changed, noteworthy state — give it the accent so it reads
       at a glance that this site is an exception. */
    #siteToggleBtn.is-paused {
      background: var(--accent-soft);
      border-color: rgba(155, 59, 255, 0.42);
      color: var(--accent);
    }

    #siteToggleBtn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .shortcut-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .shortcut-hint kbd {
      font-family: inherit;
      font-size: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    /* ---------- Footer ---------- */
    .footer {
      padding: 10px 18px 14px;
      text-align: center;
    }

    .saved-flash {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.25s ease;
      height: 14px;
    }

    .saved-flash.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <div class="header-text">
      <h1 data-i18n="popupTitle">Data Saver</h1>
      <p data-i18n="popupTagline">Blocking ads, images &amp; autoplay video</p>
    </div>
  </div>

  <div class="site-primary">
    <div class="site-line">
      <span class="site-dot">🌐</span>
      <span class="site-body">
        <div id="siteHost">&nbsp;</div>
        <div id="siteStatus">&nbsp;</div>
      </span>
    </div>
    <button id="siteToggleBtn" type="button" data-i18n="siteDontBlock">Don't block on this site</button>
    <div class="shortcut-hint"><span data-i18n="shortcutHint">or press</span> <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd></div>
  </div>

  <div class="savings">
    <div class="savings-top" id="savedTop" hidden>
      <span id="savedAmount"></span>
      <span id="savedUnit" data-i18n="savingsRequests">requests blocked</span>
    </div>
    <div class="savings-label" id="savedLabel" data-i18n="savingsCounting">Counting what gets blocked…</div>
    <div class="savings-breakdown">
      <div class="savings-stat">
        <b id="statAds">0</b>
        <span data-i18n="savingsAds">ads</span>
      </div>
      <div class="savings-stat">
        <b id="statImages">0</b>
        <span data-i18n="savingsImages">images</span>
      </div>
      <div class="savings-stat">
        <b id="statMedia">0</b>
        <span data-i18n="savingsVideos">videos</span>
      </div>
    </div>
    <div class="savings-foot">
      <span id="savedSince" data-i18n="savingsEstimated">Estimated from blocked requests</span>
      <button id="resetStats" type="button" data-i18n="savingsReset">Reset</button>
    </div>
  </div>

  <div class="rules">
    <label class="rule-row">
      <span class="rule-icon">🚫</span>
      <span class="rule-body">
        <span class="rule-title" data-i18n="blockAds">Block Ads</span>
        <span class="rule-subtitle" data-i18n="blockAdsSub">Ad networks &amp; trackers</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="adsToggle">
        <span class="slider"></span>
      </span>
    </label>

    <label class="rule-row">
      <span class="rule-icon">🖼️</span>
      <span class="rule-body">
        <span class="rule-title" data-i18n="blockImages">Block Images</span>
        <span class="rule-subtitle" data-i18n="blockImagesSub">Loads pages as text-only</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="imagesToggle">
        <span class="slider"></span>
      </span>
    </label>

    <label class="rule-row">
      <span class="rule-icon">🎬</span>
      <span class="rule-body">
        <span class="rule-title" data-i18n="blockVideos">Block Videos</span>
        <span class="rule-subtitle" data-i18n="blockVideosSub">Stops autoplay &amp; streaming</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="mediaToggle">
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <div class="footer">
    <div class="saved-flash" id="savedFlash" data-i18n="saved">Saved</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
